name: SlickDash
options:
  bundleIdPrefix: com.robfraser
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: SlickDash
    INFOPLIST_KEY_CFBundleDisplayName: SlickDash
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: SlickDash finds a PlayStation 5 on your Wi-Fi to read Gran Turismo 7 telemetry.
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  SlickDash:
    type: application
    platform: iOS
    sources: [SlickDash]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robfraser.slickdash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
  SlickDashTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlickDashTests]
    dependencies:
      - target: SlickDash
    settings:
      base:
        PRODUCT_NAME: SlickDashTests
        PRODUCT_MODULE_NAME: SlickDashTests
        PRODUCT_BUNDLE_IDENTIFIER: com.robfraser.slickdash.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  SlickDash:
    build:
      targets:
        SlickDash: all
        SlickDashTests: [test]
    test:
      targets:
        - SlickDashTests
