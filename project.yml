name: SlickDash
options:
  bundleIdPrefix: com.robfraser
  deploymentTarget:
    iOS: "17.0"
packages:
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.15.0
settings:
  base:
    PRODUCT_NAME: SlickDash
    INFOPLIST_KEY_CFBundleDisplayName: SlickDash
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: SlickDash finds a PlayStation 5 on your Wi-Fi to read Gran Turismo 7 telemetry.
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  SlickDash:
    type: application
    platform: iOS
    sources: [SlickDash]
    dependencies:
      - package: sentry-cocoa
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robfraser.slickdash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
